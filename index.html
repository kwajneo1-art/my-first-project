<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening Portfoliom</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h1 { margin-bottom: 10px; }
        p { font-size: 1.1rem; opacity: 0.9; }
        
        /* BOSILADIGAN TUGMA UCHUN STIL */
        .btn {
            display: inline-block;
            background: #2ea44f;
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #2c974b;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Salom, men Kwajneo! 👋</h1>
        <p>Bu mening GitHub'dagi birinchi mukammal loyiham.</p>
        
        <a href="https://github.com/kwajneo1-art" class="btn">Mening profilimga o'tish</a>
    </div>
</body>
</html>
